services:
  db:
    image: postgres:16
    container_name: postgresql-contacts-app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: contacts-app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  f-end:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - db
      - b-end

  b-end:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATASOURCE_NAME=db
      - DATASOURCE_PORT=5432
      - DATASOURCE_USERNAME=postgres
      - DATASOURCE_PASSWORD=admin
    depends_on:
      - db

volumes:
  db_data:
